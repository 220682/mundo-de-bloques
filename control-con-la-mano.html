<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control con la mano</title>
<style>
  html,body{margin:0;height:100%;background:#1b2330;color:#eee;font-family:system-ui,Segoe UI,sans-serif;overflow:hidden}
  #mundo{position:fixed;inset:0;cursor:none}
  #panel{position:fixed;top:12px;left:12px;background:rgba(0,0,0,.6);padding:12px 16px;border-radius:8px;font-size:14px;line-height:1.5;max-width:360px}
  #panel h1{font-size:17px;margin:0 0 6px}
  #estado{color:#ffd54f;margin:6px 0}
  button{font-size:15px;padding:8px 14px;border:0;border-radius:6px;background:#4caf50;color:#fff;cursor:pointer}
  button:disabled{background:#666;cursor:default}
  #camara{position:fixed;right:12px;bottom:12px;width:256px;height:192px;border:2px solid #ffffff40;border-radius:8px;overflow:hidden;background:#000}
  #camara video,#camara canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
</style>
</head>
<body>
<canvas id="mundo"></canvas>

<div id="panel">
  <h1>Control con la mano (y con el mouse)</h1>
  <div id="estado">Cámara apagada. Puedes usar el mouse.</div>
  <button id="btn">Activar cámara</button>
  <div style="margin-top:8px">
    • Mueve la mano: el cursor la sigue.<br>
    • Junta pulgar e índice (pellizco) = clic.<br>
    • Clic en un bloque lo rompe; en un espacio vacío pone el bloque elegido.<br>
    • Elige el bloque en la barra de abajo (o teclas 1-3).
  </div>
</div>

<div id="camara">
  <video id="video" playsinline muted></video>
  <canvas id="trazo"></canvas>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const mundo = document.getElementById("mundo");
const ctx = mundo.getContext("2d");
const video = document.getElementById("video");
const trazo = document.getElementById("trazo");
const tctx = trazo.getContext("2d");
const estado = document.getElementById("estado");
const btn = document.getElementById("btn");

// ---------- Mundo de bloques (2D, de prueba) ----------
const COLS = 12, FILAS = 8;
const TIPOS = [
  { nombre: "Pasto",  cara: "#7a5230", tapa: "#5fa83b" },
  { nombre: "Tierra", cara: "#7a5230", tapa: "#7a5230" },
  { nombre: "Piedra", cara: "#8a8a8a", tapa: "#9c9c9c" },
];
const grid = Array.from({ length: FILAS }, (_, f) =>
  Array.from({ length: COLS }, () => (f === FILAS - 3 ? 0 : f === FILAS - 2 ? 1 : f === FILAS - 1 ? 2 : null)));
let elegido = 0;
let tam, ox, oy, W, H;
const particulas = [];

function medir() {
  W = mundo.width = innerWidth;
  H = mundo.height = innerHeight;
  tam = Math.floor(Math.min(W / COLS, (H - 110) / FILAS) * 0.92);
  ox = Math.floor((W - tam * COLS) / 2);
  oy = Math.floor((H - 110 - tam * FILAS) / 2) + 10;
}
addEventListener("resize", medir);
medir();

function celda(x, y) {
  const c = Math.floor((x - ox) / tam), f = Math.floor((y - oy) / tam);
  return c >= 0 && c < COLS && f >= 0 && f < FILAS ? { c, f } : null;
}

function ranura(x, y) {
  const s = 64, x0 = W / 2 - (TIPOS.length * (s + 10)) / 2, y0 = H - s - 20;
  for (let i = 0; i < TIPOS.length; i++) {
    const xi = x0 + i * (s + 10);
    if (x >= xi && x <= xi + s && y >= y0 && y <= y0 + s) return i;
  }
  return -1;
}

function accion(x, y) {
  const r = ranura(x, y);
  if (r >= 0) { elegido = r; return; }
  const k = celda(x, y);
  if (!k) return;
  const t = grid[k.f][k.c];
  if (t !== null) {
    grid[k.f][k.c] = null;
    const cx = ox + k.c * tam + tam / 2, cy = oy + k.f * tam + tam / 2;
    for (let i = 0; i < 18; i++)
      particulas.push({ x: cx, y: cy, vx: (Math.random() - .5) * 8, vy: -Math.random() * 7, vida: 40,
                        color: Math.random() < .5 ? TIPOS[t].cara : TIPOS[t].tapa });
  } else {
    grid[k.f][k.c] = elegido;
  }
}

function dibujarBloque(x, y, s, t) {
  ctx.fillStyle = TIPOS[t].cara;
  ctx.fillRect(x, y, s, s);
  ctx.fillStyle = TIPOS[t].tapa;
  ctx.fillRect(x, y, s, s * 0.25);
  ctx.strokeStyle = "#00000055";
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, s - 2, s - 2);
}

// ---------- Cursor: mouse o mano ----------
const cur = { x: innerWidth / 2, y: innerHeight / 2, fuente: "mouse", pellizco: false };
mundo.addEventListener("mousemove", e => { cur.x = e.clientX; cur.y = e.clientY; cur.fuente = "mouse"; });
mundo.addEventListener("mousedown", e => { cur.fuente = "mouse"; accion(e.clientX, e.clientY); });
addEventListener("keydown", e => { const n = +e.key; if (n >= 1 && n <= TIPOS.length) elegido = n - 1; });
mundo.addEventListener("wheel", e => { elegido = (elegido + (e.deltaY > 0 ? 1 : TIPOS.length - 1)) % TIPOS.length; });

// ---------- Cámara + detección de mano (MediaPipe) ----------
let detector = null, ultimoTiempo = -1, objetivo = null;
const SUAVE = 0.35;                 // 0 = no se mueve, 1 = sin suavizado
const ZONA = [0.2, 0.8];            // parte central de la cámara que cubre toda la pantalla
const UNIONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
                 [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

btn.onclick = async () => {
  btn.disabled = true;
  try {
    estado.textContent = "Pidiendo permiso de la cámara...";
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    await video.play();
    estado.textContent = "Cargando el detector de mano (la primera vez tarda unos segundos)...";
    const archivos = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const opciones = d => ({
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: d },
      runningMode: "VIDEO", numHands: 1,
    });
    try { detector = await HandLandmarker.createFromOptions(archivos, opciones("GPU")); }
    catch { detector = await HandLandmarker.createFromOptions(archivos, opciones("CPU")); }
    estado.textContent = "Listo. Muestra la mano a la cámara.";
    btn.textContent = "Cámara activa";
  } catch (err) {
    estado.textContent = "No se pudo activar: " + err.message;
    btn.disabled = false;
  }
};

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mapa = v => Math.min(1, Math.max(0, (v - ZONA[0]) / (ZONA[1] - ZONA[0])));

function leerMano() {
  if (!detector || video.readyState < 2 || video.currentTime === ultimoTiempo) return;
  ultimoTiempo = video.currentTime;
  const res = detector.detectForVideo(video, performance.now());
  trazo.width = video.videoWidth; trazo.height = video.videoHeight;
  tctx.clearRect(0, 0, trazo.width, trazo.height);
  const m = res.landmarks && res.landmarks[0];
  if (!m) { objetivo = null; estado.textContent = "No veo la mano."; return; }
  estado.textContent = cur.pellizco ? "Mano detectada: PELLIZCO (clic)" : "Mano detectada.";

  // dibujo del esqueleto de la mano en la vista de la cámara
  tctx.strokeStyle = "#4caf50"; tctx.lineWidth = 3;
  for (const [a, b] of UNIONES) {
    tctx.beginPath();
    tctx.moveTo(m[a].x * trazo.width, m[a].y * trazo.height);
    tctx.lineTo(m[b].x * trazo.width, m[b].y * trazo.height);
    tctx.stroke();
  }
  tctx.fillStyle = "#ffeb3b";
  for (const p of m) { tctx.beginPath(); tctx.arc(p.x * trazo.width, p.y * trazo.height, 4, 0, 7); tctx.fill(); }

  // cursor = punto medio entre pulgar (4) e índice (8): no salta al pellizcar
  const px = (m[4].x + m[8].x) / 2, py = (m[4].y + m[8].y) / 2;
  objetivo = { x: (1 - mapa(px)) * W, y: mapa(py) * H };   // espejo en x

  // pellizco, relativo al tamaño de la mano (muñeca 0 a base del dedo medio 9), con histéresis
  const r = dist(m[4], m[8]) / dist(m[0], m[9]);
  if (!cur.pellizco && r < 0.3) { cur.pellizco = true; accion(cur.x, cur.y); }
  else if (cur.pellizco && r > 0.5) cur.pellizco = false;
}

// ---------- Bucle principal ----------
function cuadro() {
  leerMano();
  if (objetivo) {
    cur.fuente = "mano";
    cur.x += (objetivo.x - cur.x) * SUAVE;
    cur.y += (objetivo.y - cur.y) * SUAVE;
  }

  const cielo = ctx.createLinearGradient(0, 0, 0, H);
  cielo.addColorStop(0, "#6ec6ff"); cielo.addColorStop(1, "#cdeeff");
  ctx.fillStyle = cielo; ctx.fillRect(0, 0, W, H);

  for (let f = 0; f < FILAS; f++)
    for (let c = 0; c < COLS; c++)
      if (grid[f][c] !== null) dibujarBloque(ox + c * tam, oy + f * tam, tam, grid[f][c]);

  const k = celda(cur.x, cur.y);
  if (k) {
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
    ctx.strokeRect(ox + k.c * tam + 2, oy + k.f * tam + 2, tam - 4, tam - 4);
  }

  for (let i = particulas.length - 1; i >= 0; i--) {
    const p = particulas[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.4;
    ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 7, 7);
    if (--p.vida <= 0) particulas.splice(i, 1);
  }

  // barra de bloques
  const s = 64, x0 = W / 2 - (TIPOS.length * (s + 10)) / 2, y0 = H - s - 20;
  TIPOS.forEach((t, i) => {
    const xi = x0 + i * (s + 10);
    ctx.fillStyle = "#00000080"; ctx.fillRect(xi - 4, y0 - 4, s + 8, s + 8);
    dibujarBloque(xi + 8, y0 + 8, s - 16, i);
    if (i === elegido) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 4; ctx.strokeRect(xi - 4, y0 - 4, s + 8, s + 8); }
    ctx.fillStyle = "#fff"; ctx.font = "12px sans-serif"; ctx.fillText(i + 1, xi, y0 + 10);
  });

  // cursor
  ctx.beginPath(); ctx.arc(cur.x, cur.y, cur.pellizco ? 10 : 16, 0, 7);
  ctx.fillStyle = cur.pellizco ? "#ff5252" : cur.fuente === "mano" ? "#ffeb3bcc" : "#ffffffcc";
  ctx.fill(); ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.stroke();

  requestAnimationFrame(cuadro);
}
cuadro();
</script>
</body>
</html>
